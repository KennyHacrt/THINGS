<!doctype html><html><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#202632;font:15px Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 18px;background:#eceff4;color:#344157}button.primary{background:#7760ae;color:white}button:hover{filter:brightness(.96)}button.selected,.pill.selected{background:#e7dff3;color:#71519e}input,select{padding:13px;border:1px solid #dce0e7;border-radius:9px;min-width:0;background:white;color:#253046}label{display:flex;flex-direction:column;gap:7px;color:#8790a0;font-size:12px}h1{font-size:32px;letter-spacing:-1px;margin:5px 0 8px}h2{font-size:20px;margin:0}p{line-height:1.55}header{height:74px;background:#e8eaf0;display:flex;align-items:center;padding:0 18px;gap:13px}.dots{color:#a4aab6;letter-spacing:5px}.address{background:#f6f7fa;border-radius:8px;padding:11px 18px;flex:1;color:#667082;font-size:12px}nav{display:flex;gap:6px;padding:13px 28px;background:white;border-bottom:1px solid #e9edf1}nav button{padding:9px 15px;background:none;font-size:13px}nav button.active{color:#7755a3;background:#eee7f5}.content{padding:30px 38px}.eyebrow{font-size:11px;letter-spacing:2px;color:#9075ad;text-transform:uppercase}.muted{color:#8c94a3}.form{background:white;border-radius:18px;padding:25px;display:grid;gap:14px;grid-template-columns:1fr 1fr 1fr 1fr;margin:24px 0}.row{display:flex;align-items:center;gap:12px}.filters{display:flex;align-items:center;gap:10px;margin:18px 0}.pill{border-radius:24px;background:white;border:1px solid #e5e8ed;padding:9px 15px;font-size:12px}.card{background:white;border-radius:14px;margin:12px 0;padding:23px;display:flex;align-items:center;justify-content:space-between;gap:18px}.card .left{flex:1}.price{font-size:25px;font-weight:600}.small{font-size:12px;color:#9299a5}.tag{background:#edf3ed;color:#6c8e70;font-size:11px;padding:5px 9px;border-radius:6px}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:11px;background:#eee8f4;color:#8866ad;font-size:22px}.modal{position:fixed;top:190px;left:230px;width:600px;background:white;padding:26px;border-radius:16px;box-shadow:0 12px 80px #30224430;z-index:10}.dates{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dates button{padding:11px;border-radius:7px}.toast{background:#e9f0e9;color:#5e7e67;padding:13px;border-radius:9px;margin:12px 0;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:24px}.food{display:block;padding:0;overflow:hidden}.foodpic{height:132px;display:grid;place-items:center;font-size:72px;background:#f2e9d7}.foodbody{padding:18px}.paper{align-items:flex-start}.paper h2{font-size:19px;line-height:1.4}.abstract{margin:18px 0;background:#f5f1f8;border-radius:9px;padding:18px;line-height:1.7}.day{align-items:flex-start}.daynum{background:#e9e2f3;color:#8865ad;border-radius:10px;width:45px;padding:12px;text-align:center;font-weight:bold}.day ul{padding-left:18px;color:#737e8e;line-height:2}.cart{position:fixed;right:30px;top:130px;background:white;border-radius:16px;padding:25px;width:330px;box-shadow:0 9px 60px #30304525;z-index:5}.post{border-left:3px solid #b49acb}.tick{color:#78987c}.empty{padding:45px 0;text-align:center;color:#9ca4af}.fine{font-size:11px;color:#a2a8b2;margin:8px 0}.line{height:1px;background:#e9ecf0;margin:20px 0}
</style><body><header><span class="dots">●●●</span><span style="font-size:19px">‹　›　↻</span><div class="address" id="url">things.demo / flights</div><span style="color:#91849f;font-size:12px">Demo workspace</span></header><nav id="nav"></nav><main class="content" id="main"></main><div id="overlay"></div><script>
let page='flights',flightsFound=false,lunchFound=false,postsFound=false,papersFound=false;const $=s=>document.querySelector(s);let state={origin:'',destination:'',dates:'',direct:false,sort:'Recommended',short:[],cart:false,paper:null};
function go(p){page=p;$('#url').textContent='things.demo / '+p;$('#overlay').innerHTML='';render();}
function render(){const pages=[['flights','Flights'],['lunch','Lunch'],['updates','Travel updates'],['papers','Research'],['plan','Trip plan']];$('#nav').innerHTML=pages.map(([p,n])=>`<button data-id="tab-${p}" class="${p===page?'active':''}" onclick="go('${p}')">${n}</button>`).join('');let h='';
if(page==='flights'){h=`<div class="eyebrow">A small trip, thoughtfully planned</div><h1>Find your flight.</h1><div class="muted">Hong Kong to Tokyo · Round trip · 1 adult</div><div class="form"><label>From<input data-id="origin" placeholder="Departure city" value="${state.origin}" oninput="state.origin=this.value"></label><label>To<input data-id="destination" placeholder="Destination" value="${state.destination}" oninput="state.destination=this.value"></label><label>Travel dates<button data-id="dates" onclick="calendar()">${state.dates||'Select dates'}</button></label><label>&nbsp;<button class="primary" data-id="flight-search" onclick="flightsFound=true;render()">Search flights　→</button></label></div>`;if(flightsFound){h+=`<div class="filters"><button class="pill ${state.direct?'selected':''}" data-id="direct" onclick="state.direct=!state.direct;render()">${state.direct?'✓ ':''}Direct flights</button><button class="pill">Economy</button><span style="flex:1"></span><select data-id="sort" onchange="state.sort=this.value;render()"><option ${state.sort==='Recommended'?'selected':''}>Recommended</option><option ${state.sort==='Lowest price'?'selected':''}>Lowest price</option></select></div><div class="small">${state.direct?'3 direct options':'6 flight options'} · Sample fares for this walkthrough</div>`;const rows=state.sort==='Lowest price'?[['Harbour Air','08:15','13:25','1,980'],['Pacific Sky','10:10','15:20','2,240'],['Sakura Airways','14:30','19:45','2,680']]:[['Pacific Sky','10:10','15:20','2,240'],['Sakura Airways','14:30','19:45','2,680'],['Harbour Air','08:15','13:25','1,980']];rows.forEach((r,i)=>{h+=`<div class="card"><div class="logo">✈</div><div class="left"><b>${r[0]}</b><p style="margin:8px 0">${r[1]} HKG　────　${r[2]} TYO</p><span class="small">Direct · 4h 10m · Cabin bag included</span></div><div><div class="price">HK$${r[3]}</div><div class="small">Round trip</div></div><button data-id="short-${i}" onclick="shortlist(${i})" class="${state.short.includes(i)?'selected':''}">${state.short.includes(i)?'✓ Saved':'Shortlist'}</button></div>`;});if(state.short.length)h+=`<div class="toast">✓ ${state.short.length} option${state.short.length>1?'s':''} saved. No ticket has been booked.</div>`;}else h+='<div class="empty">Set your route and dates to compare options.</div>';}
if(page==='lunch'){h=`<div class="eyebrow">One less thing to decide</div><h1>Lunch, sorted.</h1><div class="muted">Find something nearby that fits your budget.</div><div class="form" style="grid-template-columns:2fr 1fr 1fr"><label>Delivery area<input data-id="area" placeholder="Enter an area"></label><label>Budget<select data-id="budget"><option>Any budget</option><option>Under HK$80</option></select></label><label>&nbsp;<button class="primary" data-id="lunch-search" onclick="lunchFound=true;renderLunchResults()">Find lunch　→</button></label></div><div id="food-results"></div>`;}
if(page==='updates'){h=`<div class="eyebrow">A quick catch-up</div><h1>Travel updates.</h1><div class="muted">A public-post search scenario with sample content.</div><div class="row" style="margin:25px 0"><input data-id="post-query" placeholder="Search public posts" style="flex:1"><button data-id="post-search" class="primary" onclick="postsFound=true;renderPosts()">Search　→</button></div><div id="post-results"></div>`;}
if(page==='papers'){h=`<div class="eyebrow">From a question to a reading list</div><h1>Find the right papers.</h1><div class="row" style="margin:25px 0"><input data-id="paper-query" placeholder="Search a research topic" style="flex:1"><button data-id="paper-search" class="primary" onclick="papersFound=true;renderPapers()">Search papers　→</button></div><div id="paper-results"></div>`;}
if(page==='plan'){h=`<div class="eyebrow">Everything in one place</div><h1>Your Tokyo trip.</h1><div class="muted">A three-day draft, ready for you to review.</div><div class="row" style="margin:20px 0"><span class="tag">✓ Flights shortlisted</span><span class="tag">✓ Lunch picked</span><span class="tag">✓ Updates reviewed</span></div>`;[['Arrival & Shinjuku','Arrive and leave bags at your hotel','Easy lunch near the station','Explore Shinjuku and the evening streets'],['Asakusa & Shibuya','Visit Sensō-ji and the surrounding streets','Take a lunch break before crossing town','Spend the afternoon around Shibuya'],['A slower final day','Choose a neighbourhood café','Leave time for one last walk','Return to the airport with time to spare']].forEach((a,i)=>h+=`<div class="card day"><div class="daynum">${i+1}</div><div class="left"><h2>${a[0]}</h2><ul>${a.slice(1).map(x=>'<li>'+x+'</li>').join('')}</ul></div><span class="tick">✓</span></div>`);h+='<button data-id="save-plan" class="primary" onclick="savePlan(this)">Save trip draft　↓</button>';}
$('#main').innerHTML=h;
}
function calendar(){$('#overlay').innerHTML=`<div class="modal"><h2>December 2026</h2><p class="muted">Select departure and return dates</p><div class="dates">${Array.from({length:31},(_,i)=>`<button data-id="date-${i+1}" onclick="this.classList.add('selected')">${i+1}</button>`).join('')}</div><div class="line"></div><button data-id="apply-dates" class="primary" onclick="state.dates='12 Dec — 15 Dec';$('#overlay').innerHTML='';render()">Apply dates</button></div>`;}
function shortlist(i){state.short.push(i);render();}
function renderLunchResults(){$('#food-results').innerHTML=`<div class="filters"><button class="pill" data-id="vegetarian" onclick="this.classList.toggle('selected')">Vegetarian-friendly</button><button class="pill" data-id="delivery" onclick="this.classList.toggle('selected')">Under 30 min</button><span class="small">Sample menus · Tsim Sha Tsui</span></div><div class="grid">${[['🥗','Garden Bowl','Roasted vegetable bowl','68'],['🍜','Noodle House','Mushroom noodle soup','62'],['🥙','Little Kitchen','Falafel lunch wrap','72']].map((a,i)=>`<div class="card food"><div class="foodpic">${a[0]}</div><div class="foodbody"><h2>${a[1]}</h2><p>${a[2]}</p><div class="row"><b>HK$${a[3]}</b><button data-id="food-${i}" onclick="menu(${i})">View menu</button></div></div></div>`).join('')}</div>`;}
function menu(i){$('#overlay').innerHTML=`<div class="cart"><h2>Garden Bowl</h2><p>Roasted vegetable bowl</p><p class="muted">Brown rice, greens, chickpeas and sesame dressing.</p><div class="price">HK$68</div><p class="small">Sample menu item</p><button data-id="add-lunch" class="primary" onclick="cart()">Add to basket　+</button></div>`;}
function cart(){$('#overlay').innerHTML=`<div class="cart"><span class="tag">Ready for your review</span><h2 style="margin-top:18px">Lunch basket</h2><p>1 × Roasted vegetable bowl</p><div class="line"></div><div class="row"><b>Total</b><span style="flex:1"></span><b>HK$68</b></div><p class="small">No order or payment has been placed.</p><button data-id="keep-lunch" class="primary" onclick="$('#overlay').innerHTML='<div class=cart><h2>✓ Lunch choice saved</h2><p>Waiting for your approval.</p></div>'">Keep this choice</button></div>`;}
function renderPosts(){$('#post-results').innerHTML=[['Tokyo travel desk','Planning airport transfers first makes a short city trip easier. Save the station name and leave time for the return journey.'],['Neighbourhood notes','A quieter afternoon can be as useful as a packed itinerary. Leave one open slot to explore a neighbourhood.'],['City breaks','Keep outdoor plans flexible and check the official forecast before heading out.']].map(a=>`<div class="card post"><div class="left"><b>${a[0]}</b><span class="small">　· Sample post</span><p>${a[1]}</p><span class="small">♡ 24　↗ 8　▱ 3</span></div><button data-id="save-post-${a[0].split(' ')[0]}" onclick="this.textContent='✓ Saved'">Save</button></div>`).join('')+'<button data-id="summarize-posts" class="primary" onclick="postSummary(this)">Summarize updates　→</button>';}
function renderPapers(){$('#paper-results').innerHTML=[['Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks','Lewis et al. · 2020','2005.11401'],['REALM: Retrieval-Augmented Language Model Pre-Training','Guu et al. · 2020','2002.08909']].map((a,i)=>`<div class="card paper"><div class="logo">▤</div><div class="left"><h2>${a[0]}</h2><p class="small">${a[1]} · arXiv:${a[2]}</p><div data-id="abstract-${i}" id="abstract-${i}"></div></div><button data-id="read-${i}" onclick="abstract(${i})">Read abstract</button></div>`).join('')+'<button data-id="save-papers" class="primary" onclick="papersSaved(this)">Save reading list　↓</button>';}
function abstract(i){document.getElementById('abstract-'+i).innerHTML='<div class="abstract">'+(i===0?'Combines a retriever with a sequence-to-sequence model so generation can use information from an external document collection.':'Explores learning a retriever and language model together during pre-training, allowing the model to retrieve useful knowledge.')+'</div>';}
function savePlan(e){e.textContent='✓ Draft saved in demo workspace';}
function postSummary(e){e.insertAdjacentHTML('afterend','<div class=toast>Three takeaways: plan transfers, leave breathing room, and check the forecast.</div>');}
function papersSaved(e){e.insertAdjacentHTML('afterend','<div class=toast>✓ Two papers saved to the demo reading list with their arXiv links.</div>');}
render();
</script></body></html>
