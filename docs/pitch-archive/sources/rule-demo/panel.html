<!doctype html><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#292530;font:14px Segoe UI,sans-serif}header{padding:20px 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #e6e1e9}.brand{font-size:28px;font-weight:700;letter-spacing:-1px}.sub{font-size:11px;color:#a095ac;margin-top:4px}.hand{width:42px;height:50px}.chat{padding:18px;height:425px;overflow:auto}.bubble{border-radius:15px;background:white;padding:15px;margin-bottom:12px;line-height:1.65;font-size:14px}.user{background:#e9e1f2;margin-left:20px}.label{font-size:9px;letter-spacing:1.3px;color:#a28fb2;margin-bottom:6px}.draft{color:#8b77a1}.tasks{padding:0 22px;display:flex;flex-wrap:wrap;gap:7px}.tasks span{padding:5px 8px;border-radius:7px;font-size:10px;color:#95839e;background:#eae4ef}.tasks span.done{color:#67866d;background:#e5ede5}.footer{position:fixed;bottom:0;left:0;right:0;padding:14px 20px;background:#f0ede9}.status{font-size:11px;color:#9a89a7;margin-bottom:12px}.mic{border-radius:12px;background:#8766b5;color:white;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px}.wave{height:22px;display:flex;align-items:center;gap:3px}.wave i{width:3px;height:5px;border-radius:4px;background:#e4d9f0;transition:height 50ms}.welcome{padding:30px 8px}.welcome h1{font-size:29px;letter-spacing:-1px}.welcome p{color:#a094ac;line-height:1.7}.dot{color:#87a390}.live{display:inline-block;width:2px;height:15px;background:#9c80bc;margin-left:2px}</style><header><img class=hand src="../../outputs/THINGS/public/thing-pointer.svg"><div><div class=brand>things.</div><div class=sub><span class=dot>●</span> Your desktop companion</div></div></header><div id=chat class=chat><div class=welcome><h1>What’s the thing?</h1><p>Tell me naturally.<br>I’ll work right here on your desktop.</p></div></div><div class=tasks id=tasks></div><div class=footer><div class=status id=status>Ready when you are.</div><div class=mic>♩ <span id=miclabel>Listening</span><div class=wave><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div></div><script>
const chat=document.getElementById('chat'),status=document.getElementById('status');const taskNames=['Flights','Lunch','Updates','Papers','Trip plan'];let done=[];
function bubble(text,role='assistant'){chat.querySelector('.welcome')?.remove();chat.insertAdjacentHTML('beforeend',`<div class="bubble ${role==='user'?'user':''}"><div class=label>${role==='user'?'YOU SAID':'THINGS'}</div><div>${text}</div></div>`);chat.scrollTop=chat.scrollHeight;}
function working(text){status.textContent=text;document.getElementById('miclabel').textContent='Working';}
function complete(i){done.push(i);document.getElementById('tasks').innerHTML=taskNames.map((x,j)=>`<span class="${done.includes(j)?'done':''}">${done.includes(j)?'✓ ':''}${x}</span>`).join('');}
async function speech(base64,text,role='user'){const ctx=new AudioContext();await ctx.resume();const arr=Uint8Array.from(atob(base64),c=>c.charCodeAt(0)),buffer=await ctx.decodeAudioData(arr.buffer),src=ctx.createBufferSource(),analyser=ctx.createAnalyser();analyser.fftSize=256;src.buffer=buffer;src.connect(analyser);analyser.connect(ctx.destination);const bins=new Uint8Array(analyser.frequencyBinCount);let draft;if(role==='user'){chat.querySelector('.welcome')?.remove();draft=document.createElement('div');draft.className='bubble user';draft.innerHTML='<div class=label>YOU’RE SAYING</div><div class=draft></div>';chat.append(draft);status.textContent='Listening to you…';}const start=ctx.currentTime;const timer=setInterval(()=>{analyser.getByteFrequencyData(bins);document.querySelectorAll('.wave i').forEach((e,i)=>e.style.height=(4+(bins[i*5]||0)/255*22)+'px');if(draft){const words=text.split(' '),n=Math.max(1,Math.floor((ctx.currentTime-start)/buffer.duration*words.length));draft.lastChild.innerHTML=words.slice(0,n).join(' ')+'<span class=live></span>';chat.scrollTop=chat.scrollHeight;}},70);return new Promise(resolve=>{src.onended=()=>{clearInterval(timer);document.querySelectorAll('.wave i').forEach(e=>e.style.height='5px');draft?.remove();if(role==='user')bubble(text,'user');ctx.close();resolve();};src.start();});}
</script>
